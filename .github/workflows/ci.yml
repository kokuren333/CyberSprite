name: CI
on: [push, pull_request]

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --extra mcp --extra gui --python ${{ matrix.python }}
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src/cybersprite/core src/cybersprite/ops
      - name: Strict typed model and argument contracts
        run: >-
          uv run mypy --strict --follow-imports=silent
          src/cybersprite/core/models.py src/cybersprite/core/canonical.py
          src/cybersprite/core/errors.py src/cybersprite/core/hashing.py
          src/cybersprite/core/references.py src/cybersprite/ops/args.py
          src/cybersprite/ops/descriptions.py
      - run: uv run pytest
      - name: Independently decode every built-in raster export
        run: uv run pytest -q -m independent_decoder
      - run: uv run python tools/gen_schemas.py --check
      - run: uv run python tools/check_licenses.py --include-dev --extra mcp --extra gui
      - run: uv pip install hatchling==1.27.0 && uv run --no-sync python tools/check_licenses.py --include-build
      - run: uv run python tools/check_repository.py
  gui:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: uv sync --locked --extra mcp --extra gui --python 3.12
      - run: npm ci
        working-directory: gui
      # Reports contain installed native packages, so audit on each target OS.
      - run: node tools/check_js_licenses.mjs
      - run: npm test
        working-directory: gui
      - run: npm run build
        working-directory: gui
      - run: npx playwright install --with-deps chromium
        working-directory: gui
      - run: npm run test:e2e
        working-directory: gui
      - name: Build release archives and inspect packaged GUI and license texts
        run: uv run python tools/build_release.py
      - name: Install wheel outside repository and probe CLI, MCP and GUI
        run: uv run python tools/verify_release.py dist/cybersprite-0.1.0-py3-none-any.whl
