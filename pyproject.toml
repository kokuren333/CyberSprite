[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cybersprite"
version = "0.1.0"
description = "Deterministic indexed-color sprite core"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "third_party/licenses/*.txt"]
dependencies = [
    "numpy==2.3.4",
    "pydantic==2.12.3",
    "click==8.3.0",
    "pillow>=12",
    "aseprite==0.1.0",
]

[project.scripts]
cybersprite = "cybersprite.cli:main"
csp = "cybersprite.cli:main"

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]
gui = ["starlette==1.10.0", "uvicorn==0.54.0", "websockets==16.0", "jsonschema==4.26.0"]
pixeloe = []
diffusers = []

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.1", "mypy==1.15.0", "packaging==26.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/cybersprite"]
artifacts = ["src/cybersprite/server/static/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/cybersprite/server/static/**"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", "e2e-tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "independent_decoder: cross-check built-in raster exports with Pillow on every CI OS",
    "gpu: opt-in local CUDA generation; requires user-installed stack and accepted weights",
]

[tool.mypy]
python_version = "3.12"
files = ["src/cybersprite/core", "src/cybersprite/ops"]
check_untyped_defs = true

[tool.ruff.lint.per-file-ignores]
# Test-input artwork generators (authored by the design agent); style rules only.
"tests/pipeline/corpus/**" = ["B905", "B007", "UP031", "E501"]
"assets/ui/icons/tools/**" = ["B904", "B007", "E501"]
